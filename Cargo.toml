[package]
name = "mysql-mcp"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A precision-safe MySQL MCP server for database operations and object archiving"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
csv = "1"
hex = "0.4"
mysql_async = "0.37"
num-bigint = "0.4"
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = "0.62"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "fs", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
strip = true
lto = "thin"
