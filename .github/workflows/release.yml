name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BINARY_NAME: mysql-mcp
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $asset = "$env:BINARY_NAME-windows-$arch.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/release/$env:BINARY_NAME.exe" -DestinationPath "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "dist/$asset.sha256"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          arch=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          asset="$BINARY_NAME-$os-$arch.tar.gz"
          package_dir="$RUNNER_TEMP/$BINARY_NAME-package"
          mkdir -p "$package_dir" dist
          cp "target/release/$BINARY_NAME" "$package_dir/$BINARY_NAME"
          tar -C "$package_dir" -czf "dist/$asset" "$BINARY_NAME"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Upload matrix artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: dist/*.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在；Release 资产不可变，请使用新的 tag。" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "包含 Windows、Linux、macOS 安装包及 SHA-256 校验文件。版本变更请查看当前项目的标签比较页面。"
